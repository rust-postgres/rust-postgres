[package]
name = "tokio-postgres"
version = "0.7.18"
authors = ["Steven Fackler <sfackler@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A native, asynchronous PostgreSQL client"
repository = "https://github.com/rust-postgres/rust-postgres"
readme = "../README.md"
keywords = ["database", "postgres", "postgresql", "sql", "async"]
categories = ["database"]
rust-version = "1.85"

[lib]
# Flipped from `false` so the `gss` module's own `#[cfg(test)]` tests are compiled
# and run; `src/row.rs`'s existing ones start running too. Happy to revert this and
# relocate the tests if you would rather keep the lib test target off.
test = true

[[bench]]
name = "bench"
harness = false

[package.metadata.docs.rs]
all-features = true

[features]
default = ["runtime"]
runtime = ["tokio/net", "tokio/time"]

array-impls = ["postgres-types/array-impls"]
with-bit-vec-0_6 = ["postgres-types/with-bit-vec-0_6"]
with-bit-vec-0_7 = ["postgres-types/with-bit-vec-0_7"]
with-bit-vec-0_8 = ["postgres-types/with-bit-vec-0_8"]
with-bit-vec-0_9 = ["postgres-types/with-bit-vec-0_9"]
with-chrono-0_4 = ["postgres-types/with-chrono-0_4"]
with-cidr-0_2 = ["postgres-types/with-cidr-0_2"]
with-cidr-0_3 = ["postgres-types/with-cidr-0_3"]
with-eui48-0_4 = ["postgres-types/with-eui48-0_4"]
with-eui48-1 = ["postgres-types/with-eui48-1"]
with-geo-types-0_6 = ["postgres-types/with-geo-types-0_6"]
with-geo-types-0_7 = ["postgres-types/with-geo-types-0_7"]
with-jiff-0_1 = ["postgres-types/with-jiff-0_1"]
with-jiff-0_2 = ["postgres-types/with-jiff-0_2"]
with-serde_json-1 = ["postgres-types/with-serde_json-1"]
with-smol_str-01 = ["postgres-types/with-smol_str-01"]
with-uuid-0_8 = ["postgres-types/with-uuid-0_8"]
with-uuid-1 = ["postgres-types/with-uuid-1"]
with-time-0_2 = ["postgres-types/with-time-0_2"]
with-time-0_3 = ["postgres-types/with-time-0_3"]
js = ["postgres-protocol/js", "postgres-types/js"]

# Kerberos (GSSAPI on Unix, SSPI on Windows). NOT in `default`: the Unix backend
# links the system GSS library, which a build machine may not have headers for.
# With the feature off, `connect_raw` keeps its existing refusal of
# AuthenticationGSS/AuthenticationSSPI and neither backend is compiled.
gss = ["dep:libgssapi", "dep:windows-sys"]

[dependencies]
async-trait = "0.1"
bytes = "1.11"
byteorder = "1.0"
fallible-iterator = "0.2"
futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
] }
log = "0.4"
parking_lot = "0.12"
percent-encoding = "2.0"
pin-project-lite = "0.2.11"
phf = "0.13"
postgres-protocol = { version = "0.6.12", path = "../postgres-protocol" }
postgres-types = { version = "0.2.14", path = "../postgres-types" }
tokio = { version = "1.27", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
rand = "0.10.0"
whoami = "2.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

# Kerberos backends, both optional and both gated by `gss`.
#
# `libgssapi` binds the SYSTEM GSS library (MIT krb5 / Heimdal), so an existing
# `kinit` ticket cache and the system krb5.conf work with no extra configuration.
[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.11", optional = true, default-features = false }

# SSPI through the OS — `windows-sys` rather than the heavier `windows` crate, and
# no third-party crypto at all.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Credentials",
  # SEC_WINNT_AUTH_IDENTITY_W lives here, not beside the SSPI functions.
  "Win32_System_Rpc",
] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = [
  "async-await-macro",
] }
futures-executor = "0.3"
criterion = "0.7"
env_logger = "0.11"
tokio = { version = "1.0", features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "time",
] }

bit-vec-06 = { version = "0.6", package = "bit-vec" }
bit-vec-07 = { version = "0.7", package = "bit-vec" }
bit-vec-08 = { version = "0.8", package = "bit-vec" }
bit-vec-09 = { version = "0.9", package = "bit-vec" }
chrono-04 = { version = "0.4", package = "chrono", default-features = false }
eui48-1 = { version = "1.0", package = "eui48", default-features = false }
geo-types-06 = { version = "0.6", package = "geo-types" }
geo-types-07 = { version = "0.7", package = "geo-types" }
jiff-01 = { version = "0.1", package = "jiff" }
jiff-02 = { version = "0.2", package = "jiff" }
serde_json-1 = { version = "1.0", package = "serde_json" }
smol_str-01 = { version = "0.1", package = "smol_str" }
uuid-08 = { version = "0.8", package = "uuid" }
uuid-1 = { version = "1.0", package = "uuid" }
time-02 = { version = "0.2", package = "time" }
time-03 = { version = "0.3", package = "time", features = ["parsing"] }
